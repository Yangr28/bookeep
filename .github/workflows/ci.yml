name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: check (${{ matrix.timezone }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 双时区矩阵：TZ=UTC 复现用户海外时区场景，TZ=Asia/Shanghai 复现国内场景
        timezone: [UTC, Asia/Shanghai]
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        # 存量 lint 问题待专项清理，先非阻断；tsc/test 严格把关
        continue-on-error: true
        run: npm run lint

      - name: Test
        run: npm test
